services:
  - type: web
    name: cuentasclaras-backend
    runtime: docker
    plan: free
    region: oregon
    # Cambia la ruta al Dockerfile de la raíz
    dockerfilePath: ../Dockerfile
    # El contexto debe ser la raíz del proyecto
    dockerContext: ..
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: 50