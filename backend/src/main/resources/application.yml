server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cuentasclaras-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE_MB:50}MB
      max-request-size: ${MAX_UPLOAD_SIZE_MB:50}MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    com.cuentasclaras: DEBUG