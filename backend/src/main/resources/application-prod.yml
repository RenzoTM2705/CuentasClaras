server:
  port: ${PORT:8080}

spring:
  application:
    name: cuentasclaras-backend
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE_MB:50}MB
      max-request-size: ${MAX_UPLOAD_SIZE_MB:50}MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    com.cuentasclaras: INFO